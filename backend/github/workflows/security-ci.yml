name: Security CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install security testing tools
        pip install bandit pip-audit pytest

    - name: Run Bandit (SAST - Fail on High/Medium Confidence)
      run: bandit -r api/ core/ main.py -ll

    - name: Dependency Vulnerability Audit (SCA)
      run: pip-audit

    - name: Run Security & Tenant Isolation Tests
      # Ensures DB RLS and RBAC policies are actively blocking unauthorized access
      run: pytest tests/ -v