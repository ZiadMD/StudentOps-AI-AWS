[project]
name = "studentops-backend"
version = "0.1.0"
description = "StudentOps AI - AI-powered HR and Student Operations Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "httpx>=0.27.2",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "asyncpg>=0.30.0",
    "python-multipart>=0.0.18",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pywhatkit>=5.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
