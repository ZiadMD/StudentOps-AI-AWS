name: StudentOps CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Seed test database
        run: uv run python -m app.seed.seed_data

      - name: Run automated test suite
        run: uv run pytest tests -v --durations=10

  frontend-build:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck & production build
        run: npm run build

  security-and-lint:
    name: Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for uncommitted .env secrets
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "ERROR: backend/.env is tracked in git! Secrets must never be committed."
            exit 1
          fi
          echo "Secret check passed: .env is properly gitignored."
