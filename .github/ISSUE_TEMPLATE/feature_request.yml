name: "✨ Feature Request"
description: "Suggest an idea or operational feature for StudentOps AI."
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make community operations, scoring, or scheduling smoother? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or operational inefficiency?
      placeholder: "e.g. Currently, exporting attendance logs requires copying from the table manually..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see built.
      placeholder: "e.g. Add a CSV/Excel export button on the Meet Attendance page..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or features you've considered?
    validations:
      required: false

  - type: dropdown
    id: target-area
    attributes:
      label: Primary Impact Area
      options:
        - "Operations & Attendance"
        - "Member Performance & Evaluations"
        - "Autonomous Agent & AI Workflows"
        - "Calendar & Event Scheduling"
        - "Auth & Multi-Role Permissions"
        - "UI / UX Design Polish"
    validations:
      required: true
