version: '3.8'

services:
  # Cloudflare Tunnel for zero-cost secure HTTPS access without port forwarding
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: studentops-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}

