openapi: 3.1.0
info:
  title: StudentOps AI
  description: StudentOps AI - AI-powered HR & Student Operations Platform
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register User
      description: 'Registers a new user account, creates credentials, links existing
        Student entity if present,

        and returns initial JWT access & refresh tokens.


        SECURITY ENFORCEMENT:

        - All self-registrations are strictly created as ''member''.

        - Elevated roles (hr_admin, team_lead) can only be assigned by existing HR
        Admins.

        - Password complexity is validated server-side.'
      operationId: register_user_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login User
      description: 'Authenticates a user via email and password (JSON body),

        returning access and refresh JWT tokens.

        Protected by server-side brute-force rate limiting.'
      operationId: login_user_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh Access Token
      description: Validates a JWT refresh token, checks for revocation, rotates the
        session, and returns fresh tokens.
      operationId: refresh_access_token_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Get Current User Profile
      description: Returns the authenticated user's profile and active organization
        role.
      operationId: get_current_user_profile_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/auth/teams:
    get:
      tags:
      - Auth
      summary: List Teams
      description: Lists all teams in the organization for selection and scoping.
      operationId: list_teams_api_auth_teams_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamResponse'
                type: array
                title: Response List Teams Api Auth Teams Get
    post:
      tags:
      - Auth
      summary: Create Team
      description: Creates a new organizational team (HR Admin only).
      operationId: create_team_api_auth_teams_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/auth/users/{user_id}/role:
    patch:
      tags:
      - Auth
      summary: Update User Role
      description: 'Updates a user''s role (HR Admin only).

        Prevents unauthorized privilege escalation by requiring admin authorization.'
      operationId: update_user_role_api_auth_users__user_id__role_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/link-student:
    post:
      tags:
      - Auth
      summary: Link Student Profile
      description: 'Securely links an existing authenticated user account to a Student
        profile using a trusted HR-issued invitation token.

        Enforces single-use, email binding, and prevents account hijacking.'
      operationId: link_student_profile_api_auth_link_student_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Revokes the provided refresh token to end the session.
      operationId: logout_api_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/auth/logout-all:
    post:
      tags:
      - Auth
      summary: Logout All
      description: Revokes all active sessions for the current user.
      operationId: logout_all_api_auth_logout_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/dashboard/stats:
    get:
      tags:
      - Dashboard
      summary: Get Dashboard Stats
      description: 'Computes dashboard metrics tailored to user role:

        - hr_admin: global organizational metrics.

        - team_lead: team-scoped operational metrics.

        - member: personal performance and upcoming events.'
      operationId: get_dashboard_stats_api_dashboard_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
      security:
      - OAuth2PasswordBearer: []
  /api/agent/chat:
    post:
      tags:
      - Agent
      summary: Chat With Agent
      description: Processes a natural language query through the ReAct Agent (full
        response).
      operationId: chat_with_agent_api_agent_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatMessage'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/agent/stream:
    post:
      tags:
      - Agent
      summary: Stream Chat With Agent
      description: "Streams the agent response as Server-Sent Events (SSE).\n\nEvent\
        \ types:\n  data: {\"type\": \"tool\", \"tool_name\": \"...\", \"status\"\
        : \"...\", \"result\": {...}}\n  data: {\"type\": \"token\", \"content\":\
        \ \"...\"}\n  data: {\"type\": \"done\", \"requires_confirmation\": bool,\
        \ \"pending_confirmation\": {...} | null}\n  data: {\"type\": \"error\", \"\
        message\": \"...\"}"
      operationId: stream_chat_with_agent_api_agent_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatMessage'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/agent/confirm:
    post:
      tags:
      - Agent
      summary: Confirm Action
      description: 'Confirms or cancels a pending sensitive agent action.

        Enforces atomic status checking to prevent replay attacks and verifies role/team
        authorization boundaries.'
      operationId: confirm_action_api_agent_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionConfirmationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/agent/tools:
    get:
      tags:
      - Agent
      summary: Get Registered Tools
      description: Lists all available tools and schema specifications (Authenticated
        users only).
      operationId: get_registered_tools_api_agent_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/students:
    get:
      tags:
      - Students
      summary: List Students
      description: 'Lists student records with automatic organizational scoping:

        - region_hr_head / hr_admin: sees all students across all teams.

        - committee_head / committee_hr_leader / team_lead: sees only members belonging
        to their assigned team_id.

        - committee_hr_member: sees students assigned to them or in their committee.

        - committee_member / member: sees only their own student profile.'
      operationId: list_students_api_students_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      - name: assigned_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Assigned Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentResponse'
                title: Response List Students Api Students Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Students
      summary: Create Student
      description: 'Registers a new member with committee scoping and duplicate prevention.

        - region_hr_head / hr_admin: can create members across any committee or unassigned.

        - committee_head / committee_hr_leader / team_lead / committee_hr_member:
        restricted to their committee.

        - committee_member / member: forbidden (HTTP 403).'
      operationId: create_student_api_students_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/scoreboard/all:
    get:
      tags:
      - Students
      summary: Get All Scoreboards
      description: 'Retrieves scoreboards with scoping:

        - region_hr_head / hr_admin: full ground-truth scoreboard.

        - committee_head / committee_hr_leader / team_lead: scoreboard filtered to
        students in their team.

        - committee_hr_member: scoreboard for assigned cohort or committee.

        - committee_member: strictly forbidden (scores are confidential).

        - member (legacy): personal scorecard summary.'
      operationId: get_all_scoreboards_api_students_scoreboard_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StudentScoreSummary'
                type: array
                title: Response Get All Scoreboards Api Students Scoreboard All Get
      security:
      - OAuth2PasswordBearer: []
  /api/students/{student_id}:
    get:
      tags:
      - Students
      summary: Get Student
      description: Retrieves a student record after verifying permission boundary.
      operationId: get_student_api_students__student_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/score:
    get:
      tags:
      - Students
      summary: Get Student Score
      description: Retrieves a student scorecard after verifying permission boundary.
      operationId: get_student_score_api_students__student_id__score_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentScoreSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/behavior-score:
    put:
      tags:
      - Students
      summary: Update Behavior Score
      description: 'Submits or updates behavior scores (/23) for a student.

        Committee Head is strictly read-only and cannot call this endpoint.

        Committee HR Member can only grade their assigned cohort or committee students.'
      operationId: update_behavior_score_api_students__student_id__behavior_score_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorScoreUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentScoreSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/assign-cohort:
    post:
      tags:
      - Students
      summary: Assign Student Cohort
      description: 'Assigns a cohort of students to a specific HR Member.

        Managed by Committee HR Leader or Regional Head.'
      operationId: assign_student_cohort_api_students_assign_cohort_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCohortRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/students/{student_id}/phone:
    patch:
      tags:
      - Students
      summary: Update Student Phone
      description: Updates a student's phone number. Prevents duplicates.
      operationId: update_student_phone_api_students__student_id__phone_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPhoneUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/bonus:
    post:
      tags:
      - Students
      summary: Award Student Bonus
      description: 'Awards bonus points to a member.

        Authoritative workflow: HR Leader can give bonuses to members.

        Committee Head and Members are strictly forbidden.'
      operationId: award_student_bonus_api_students__student_id__bonus_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonusAwardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentScoreSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/invitation:
    post:
      tags:
      - Students
      summary: Create Student Invitation
      description: 'Generates a cryptographically secure, single-use invitation token
        for a student profile.

        Requires write-level access to the student (scoped to committee HR, committee
        heads, regional heads, or HR admins).

        Regular members are strictly forbidden.'
      operationId: create_student_invitation_api_students__student_id__invitation_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/StudentInvitationCreateRequest'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentInvitationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/attendance/meetings:
    get:
      tags:
      - Attendance
      summary: List Meetings
      operationId: list_meetings_api_attendance_meetings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Attendance
      summary: Create Meeting
      description: 'Schedules a new meeting and sets the session number and explicit
        member assignments.

        Social Media Committee Head owns operational meeting and session scheduling.'
      operationId: create_meeting_api_attendance_meetings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/attendance/meetings/{meeting_id}:
    get:
      tags:
      - Attendance
      summary: Get Meeting Attendance
      description: 'Retrieves meeting detail and attendance records scoped by role:

        - hr_admin / region_hr_head: sees all attendee records.

        - committee_head / committee_hr_leader / committee_hr_member: sees attendees
        for their committee.

        - member: sees only their own attendance record for this meeting.'
      operationId: get_meeting_attendance_api_attendance_meetings__meeting_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
          title: Meeting Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/attendance/meetings/{meeting_id}/process:
    post:
      tags:
      - Attendance
      summary: Reprocess Meeting
      description: 'Triggers the deterministic attendance policy processor for a meeting.

        HR Member takes attendance, which records statuses and flags absent members
        for human WhatsApp follow-up.'
      operationId: reprocess_meeting_api_attendance_meetings__meeting_id__process_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
          title: Meeting Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/attendance/meetings/{meeting_id}/records/{student_id}/status:
    put:
      tags:
      - Attendance
      summary: Update Attendance Status
      description: 'HR manually updates attendance status or excuse.

        Requires matching committee.'
      operationId: update_attendance_status_api_attendance_meetings__meeting_id__records__student_id__status_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
          title: Meeting Id
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAttendanceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/calendar/events:
    get:
      tags:
      - Calendar
      summary: Get Events
      operationId: get_events_api_calendar_events_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSchema'
                title: Response Get Events Api Calendar Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Calendar
      summary: Create Event
      operationId: create_event_api_calendar_events_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks:
    get:
      tags:
      - Tasks
      summary: List Tasks
      operationId: list_tasks_api_tasks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
