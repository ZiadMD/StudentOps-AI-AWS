<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --accent: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 40px 32px 28px;
  }
  header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 32px; position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  nav a {
    font-size: 13px; text-decoration: none; color: var(--muted);
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 7px;
  }
  nav a:hover { color: var(--text); border-color: #94a3b8; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px; }
  section { margin-bottom: 56px; }
  section > h2 {
    font-size: 20px; font-weight: 620; margin: 0 0 4px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  section > h2 a { font-size: 13px; font-weight: 400; color: var(--muted); text-decoration: none; }
  section > h2 a:hover { color: var(--text); text-decoration: underline; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px 24px; margin-top: 20px;
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .card .caption { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card .links { margin-top: 14px; font-size: 13px; }
  .card .links a { color: #475569; margin-right: 16px; }
  .diagram { overflow-x: auto; text-align: center; min-height: 60px; }
  .error { color: #b91c1c; font-size: 13px; text-align: left; white-space: pre-wrap;
           background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px; }
  .toggle { float: right; font-size: 12px; color: var(--muted); cursor: pointer;
            border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; }
  .toggle:hover { color: var(--text); }
  .hidden { display: none; }
</style>
</head>

const DATA = [{"title": "01 — System Design", "doc": "docs/01-system-design.md", "diagrams": [{"id": "01-architecture", "title": "High-level architecture", "caption": "Every runtime component and its dependency direction. Start here to orient yourself.", "src": "flowchart TB\n    subgraph Client[\"Client Layer\"]\n        SPA[\"React 19 SPA<br/>Vite + TypeScript + Tailwind<br/>frontend/src/App.tsx\"]\n        SSE[\"AgentChat SSE Reader<br/>ReadableStream<br/>components/AgentChat.tsx\"]\n        WS[\"WhatsApp WebSocket Client<br/>hooks/useWhatsAppThreadSync.ts\"]\n    end\n\n    subgraph Edge[\"Edge / Hosting\"]\n        VERCEL[\"Vercel Edge<br/>vercel.json rewrites<br/>/api/* to api/index.py\"]\n        OPENWA[\"OpenWA Headless Gateway<br/>Docker :2785<br/>WhatsApp Web.js\"]\n    end\n\n    subgraph API[\"FastAPI Application - backend/app/main.py\"]\n        MW[\"SecurityHeadersMiddleware<br/>CORS + CSP + HSTS\"]\n        AUTH[\"Auth / JWT<br/>api/routes_auth.py\"]\n        RBAC[\"RBAC Dependencies<br/>core/dependencies.py<br/>require_roles + verify_student_access\"]\n        REST[\"Domain Routers<br/>students, tasks, attendance,<br/>whatsapp, feedback, questions,<br/>reports, automation, calendar, audit\"]\n        AGENT[\"Agent API<br/>api/routes_agent.py<br/>chat / stream / confirm\"]\n    end\n\n    subgraph AgentCore[\"Agent Engine - backend/app/agent\"]\n        REACT[\"ReActAgent.run_step<br/>agent/react_agent.py\"]\n        TOOLS[\"Tool Registry<br/>agent/tools.py<br/>15 tools\"]\n        HITL[\"HITL Gate<br/>/agent/confirm<br/>AgentActionAudit\"]\n    end\n\n    subgraph SVC[\"Policy Services - backend/app/services\"]\n        ATT[\"AttendanceService<br/>AttendancePolicyEngine<br/>70% / 50% rules\"]\n        SCO[\"ScoringService<br/>behavior /23, task /10\"]\n        AUT[\"AutomationEngine<br/>BackgroundScheduler 300s\"]\n        REM[\"ReminderService\"]\n        IDM[\"IdentityMatcher\"]\n        AUD[\"AuditService\"]\n        WAC[\"WhatsAppService\"]\n    end\n\n    subgraph Providers[\"Providers - backend/app/providers\"]\n        MEET[\"GoogleMeetAttendanceProvider\"]\n        GCAL[\"GoogleCalendarProvider\"]\n        MSG[\"MessagingProvider<br/>mock | openwa\"]\n        OWAP[\"OpenWAProvider<br/>httpx + timeouts\"]\n    end\n\n    subgraph Data[\"Persistence\"]\n        DB[(\"SQLAlchemy 2.0 async<br/>SQLite aiosqlite (dev)<br/>PostgreSQL asyncpg (prod)\")]\n    end\n\n    subgraph LLM[\"External LLM\"]\n        GROQ[\"Groq API<br/>openai/gpt-oss-120b\"]\n        OR[\"OpenRouter API<br/>nemotron-3-super\"]\n    end\n\n    SPA --> VERCEL\n    SSE --> VERCEL\n    WS --> VERCEL\n    VERCEL --> MW\n    MW --> AUTH\n    MW --> RBAC\n    MW --> REST\n    MW --> AGENT\n    AGENT --> REACT\n    REACT --> TOOLS\n    REACT --> HITL\n    TOOLS --> ATT\n    TOOLS --> SCO\n    TOOLS --> REM\n    TOOLS --> IDM\n    REST --> AUT\n    REST --> WAC\n    REACT --> AUD\n    TOOLS --> DB\n    REST --> DB\n    AUD --> DB\n    HITL --> DB\n    ATT --> MEET\n    REM --> MSG\n    WAC --> OWAP\n    OWAP --> OPENWA\n    REACT --> GROQ\n    REACT --> OR\n\n    classDef ext fill:#fff7ed,stroke:#c2410c,color:#7c2d12\n    classDef data fill:#f1f5f9,stroke:#334155,color:#0f172a\n    class OPENWA,GROQ,OR ext\n    class DB data\n", "link": "rendered/01-architecture.svg", "file": "01-architecture.mmd"}, {"id": "01-components", "title": "Component responsibilities", "caption": "Module-level dependency map. Use it to find which file owns a behavior.", "src": "flowchart LR\n    subgraph Core[\"core/\"]\n        C1[\"config.py<br/>Pydantic Settings<br/>validate_production_secrets\"]\n        C2[\"database.py<br/>engine + AsyncSessionLocal<br/>get_db / init_db\"]\n        C3[\"security.py<br/>bcrypt hash/verify<br/>JWT create/decode\"]\n        C4[\"dependencies.py<br/>get_current_user<br/>require_roles<br/>verify_student_access\"]\n        C5[\"rate_limiter.py<br/>SlidingWindowRateLimiter\"]\n    end\n\n    subgraph Model[\"models/\"]\n        M1[\"entities.py<br/>24 SQLAlchemy tables\"]\n        M2[\"schemas.py<br/>Pydantic v2 contracts<br/>PermissionContext frozen\"]\n    end\n\n    subgraph Agent[\"agent/\"]\n        A1[\"prompts.py<br/>SYSTEM_PROMPT\"]\n        A2[\"react_agent.py<br/>run_step + is_deterministic_intent<br/>BoundedConversationState\"]\n        A3[\"tools.py<br/>TOOL_DEFINITIONS<br/>TOOL_REGISTRY\"]\n    end\n\n    subgraph Svc[\"services/\"]\n        S1[\"attendance_service.py<br/>AttendancePolicyEngine\"]\n        S2[\"scoring_service.py\"]\n        S3[\"automation_service.py<br/>run_cycle + scheduler\"]\n        S4[\"reminder_service.py\"]\n        S5[\"identity_matcher.py\"]\n        S6[\"audit_service.py\"]\n        S7[\"whatsapp_service.py\"]\n        S8[\"whatsapp_connection_manager.py\"]\n        S9[\"calendar_service.py\"]\n    end\n\n    subgraph Prov[\"providers/\"]\n        P1[\"attendance_provider.py<br/>Google + Mock\"]\n        P2[\"calendar_provider.py<br/>Google + Mock\"]\n        P3[\"messaging_provider.py<br/>factory: mock|openwa\"]\n        P4[\"openwa_provider.py\"]\n    end\n\n    subgraph Api[\"api/\"]\n        R1[\"routes_auth\"]\n        R2[\"routes_students\"]\n        R3[\"routes_tasks\"]\n        R4[\"routes_attendance\"]\n        R5[\"routes_whatsapp\"]\n        R6[\"routes_agent\"]\n        R7[\"routes_feedback\"]\n        R8[\"routes_questions\"]\n        R9[\"routes_reports\"]\n        R10[\"routes_automation\"]\n        R11[\"routes_dashboard\"]\n        R12[\"routes_calendar\"]\n        R13[\"routes_audit\"]\n    end\n\n    Seed[\"seed/seed_data.py\"]\n    Mig[\"alembic/versions<br/>4 migrations\"]\n\n    R1 --> C3\n    R1 --> C4\n    R2 --> S2\n    R2 --> C4\n    R3 --> C4\n    R4 --> S1\n    R5 --> S7\n    R6 --> A2\n    R7 --> C4\n    R8 --> C4\n    R9 --> C4\n    R10 --> S3\n    R11 --> C4\n    R12 --> S9\n    R13 --> S6\n    C4 --> C5\n    C4 --> C1\n    A2 --> A3\n    A3 --> S1\n    A3 --> S2\n    A3 --> S4\n    A3 --> S5\n    S1 --> P1\n    S4 --> P3\n    S7 --> P4\n    S9 --> P2\n    A2 --> A1\n    A2 --> M2\n    R1 --> M2\n    R2 --> M1\n    C2 --> M1\n    Seed --> M1\n    Mig --> M1\n    S3 --> C2\n", "link": "rendered/01-components.svg", "file": "01-components.mmd"}, {"id": "01-flow-task-submission", "title": "Task submission and review", "caption": "The submit to review to score-collection split across three roles.", "src": "sequenceDiagram\n    autonumber\n    actor Member as Committee Member\n    participant SPA as React SPA\n    participant API as FastAPI /api/tasks\n    participant Head as Committee Head\n    participant DB as Database\n\n    Member->>SPA: Open task detail\n    SPA->>API: POST /api/tasks/{task_id}/submit\n    API->>API: require_roles([\"committee_member\",\"member\"])\n    API->>DB: SELECT Task WHERE id = task_id\n    API->>DB: SELECT Submission WHERE task_id AND student_id\n    alt No existing submission\n        API->>DB: INSERT Submission(status = ON_TIME | LATE)\n    else Existing PENDING submission\n        API->>DB: UPDATE Submission SET status, submitted_at, file_url\n    end\n    API-->>SPA: 200 SubmissionSchema (scores redacted to null)\n    SPA-->>Member: \"Submitted\"\n\n    Note over Head,DB: Committee Head reviews the deliverable\n    Head->>API: PUT /api/tasks/submissions/{submission_id}/review\n    API->>API: require_roles([\"committee_head\",\"team_lead\",\"hr_admin\"])\n    API->>DB: SELECT Submission JOIN Student JOIN Task\n    API->>API: Check student.team_id == caller.team_id\n    alt Cross-committee\n        API-->>Head: 403 Forbidden\n    else Same committee\n        API->>API: Reject score > task.max_score\n        API->>DB: UPDATE Submission SET score, technical_score,<br/>reviewer_notes, reviewed_at, graded_by_user_id\n        API->>DB: AuditService.record_action(REVIEW_TASK_SUBMISSION)\n        API-->>Head: 200 SubmissionSchema\n    end\n\n    Note over Head,DB: HR reads scores only, never deliverables\n    Head->>API: GET /api/tasks/{task_id}/scores\n    API->>API: Reject committee_member / member with 403\n    API->>DB: SELECT Submission JOIN Student (team scoped)\n    API-->>Head: 200 [TaskScoreItemSchema] (no file_url)\n", "link": "rendered/01-flow-task-submission.svg", "file": "01-flow-task-submission.mmd"}, {"id": "01-flow-attendance", "title": "Attendance capture", "caption": "The deterministic pipeline. Use when debugging why a member was marked absent.", "src": "sequenceDiagram\n    autonumber\n    actor HR as Committee HR Member\n    participant API as FastAPI /api/attendance\n    participant Eng as AttendancePolicyEngine\n    participant Prov as GoogleMeetAttendanceProvider\n    actor GMeet as Google Meet\n    participant IDM as IdentityMatcher\n    participant DB as Database\n\n    HR->>API: POST /api/attendance/meetings/{meeting_id}/process\n    API->>API: require_roles([\"committee_hr_member\",\"hr_admin\"])\n    API->>DB: SELECT Meeting\n    alt Other committee's meeting\n        API-->>HR: 403 Forbidden\n    end\n    API->>Eng: process_meeting_attendance(meeting_id, db)\n\n    Eng->>DB: SELECT assigned students (MeetingAssignment, else team_id)\n    Eng->>Prov: get_raw_meeting_attendance(meeting_code)\n    Prov->>GMeet: Fetch conference record participants\n    GMeet-->>Prov: display_name, email, join_time, leave_time, duration\n    Prov-->>Eng: RawMeetingAttendance.sessions\n\n    Eng->>DB: DELETE ParticipantSession WHERE meeting_id (idempotency reset)\n\n    loop For each raw participant session\n        Eng->>IDM: match_participant(display_name, email, students)\n        IDM-->>Eng: MatchResult(student_id, confidence, matched_by)\n        IDM->>IDM: Tier 1 exact email (1.0)<br/>Tier 2 Arabic name<br/>Tier 3 Latin name\n        Eng->>DB: INSERT ParticipantSession\n    end\n\n    loop For each assigned student\n        Eng->>Eng: first_join = MIN(join_time)<br/>total_duration = SUM(seconds)/60\n        alt No session\n            Eng->>Eng: status = UNEXCUSED_ABSENT\n        else Has session\n            Eng->>Eng: delay = first_join - meeting_start<br/>pct = duration / meeting_duration * 100\n            alt delay <= 10m AND pct >= 70\n                Eng->>Eng: status = PRESENT\n            else pct >= 50\n                Eng->>Eng: status = LATE\n            else\n                Eng->>Eng: status = UNEXCUSED_ABSENT\n            end\n        end\n        alt status == UNEXCUSED_ABSENT\n            Eng->>DB: INSERT MemberFollowupStatus(flagged_reason = ABSENT_{code}, status = PENDING)\n        end\n    end\n\n    Eng->>DB: COMMIT\n    Eng-->>API: [AttendanceRecord]\n    API-->>HR: 200 { success, processed_count }\n", "link": "rendered/01-flow-attendance.svg", "file": "01-flow-attendance.mmd"}, {"id": "01-flow-score-assignment", "title": "Score assignment", "caption": "Behavior-score upsert across five categories and the rating rule.", "src": "sequenceDiagram\n    autonumber\n    actor HRM as Committee HR Member\n    participant API as FastAPI /api/students\n    participant Dep as verify_student_access\n    participant Svc as ScoringService\n    participant DB as Database\n\n    HRM->>API: PUT /api/students/{student_id}/behavior-score\n    API->>API: require_roles([\"committee_hr_member\",\"hr_admin\"])\n    API->>Dep: verify_student_access(student_id, user, db)\n    alt role == committee_hr_member AND not assigned\n        Dep-->>API: 403 \"you are not assigned to this member\"\n    end\n    Dep-->>API: Student\n\n    API->>API: Validate ranges:<br/>group_interaction 0-5, social_media 0-5,<br/>hierarchy_rules 0-5, polite_conduct 0-8, interaction 0-5\n    loop For each of 5 categories\n        API->>DB: SELECT ScoreRecord WHERE student_id, category[, month]\n        alt Record exists\n            API->>DB: UPDATE points, notes, graded_by_user_id, updated_by\n        else New\n            API->>DB: INSERT ScoreRecord(max_points per category)\n        end\n    end\n    API->>DB: COMMIT\n    API->>Svc: get_student_score_summary(student_id, db)\n    Svc->>DB: SELECT AttendanceRecord, Submission, ScoreRecord\n    Svc->>Svc: behavior = group + social + hierarchy + polite\n    Svc->>Svc: rating: Outstanding if quality>=8.5 and behavior>=20 and absence==0<br/>Good if quality>=6.0 and behavior>=15 and absence<=2<br/>else Needs Improvement\n    Svc-->>API: StudentScoreSummary\n    API-->>HRM: 200 StudentScoreSummary\n\n    Note over API,DB: Committee Head is read-only. No endpoint in routes_students.py<br/>allows committee_head to write behavior scores.\n", "link": "rendered/01-flow-score-assignment.svg", "file": "01-flow-score-assignment.mmd"}, {"id": "01-flow-reminder-job", "title": "Reminder job", "caption": "Scheduler lifecycle, the three cycles, and idempotency keys.", "src": "sequenceDiagram\n    autonumber\n    participant Life as FastAPI lifespan\n    participant Sch as BackgroundScheduler<br/>interval 300s\n    participant Eng as AutomationEngine\n    participant DB as Database\n    actor HR as HR Leader\n\n    Life->>Sch: scheduler.start()\n    loop Every 300 seconds\n        Sch->>Eng: run_cycle(session)\n        Eng->>Eng: run_attendance_cycle()\n        Eng->>DB: SELECT Meetings in last 48h\n        loop Each meeting past end + grace\n            Eng->>DB: SELECT AttendanceRecord status = UNEXCUSED_ABSENT\n            Eng->>DB: SELECT existing ReminderLog by trigger_source\n            alt Not already sent (idempotency key AUTOMATION_ATTENDANCE_{meeting_id})\n                Eng->>Eng: render_template(whitelist: name, session_name, meeting_time)\n                Eng->>DB: INSERT ReminderLog(status = PENDING_APPROVAL)\n            end\n        end\n        Eng->>Eng: run_task_cycle()\n        loop Each task with deadline >= now - 7 days\n            alt Pre-deadline window (task_pre_hours)\n                Eng->>DB: get_task_reminder_candidates(pre_deadline=True)\n                Eng->>DB: INSERT TaskReminder(stage=1) + ReminderLog\n            end\n            alt Past post_trigger_time (deadline + task_post_delay_hours)\n                Eng->>DB: get_task_reminder_candidates(pre_deadline=False)\n                Eng->>DB: INSERT TaskReminder(stage=2) + ReminderLog\n                alt student.assigned_hr_id present\n                    Eng->>DB: INSERT MemberFollowupStatus(OVERDUE_TASK, PENDING)\n                end\n            end\n        end\n        Eng->>Eng: run_pre_meeting_cycle()\n        loop Each meeting in next 24h\n            Eng->>DB: SELECT students via MeetingAssignment\n            Eng->>DB: INSERT ReminderLog(trigger_source = AUTOMATION_PRE_MEETING_{id})\n        end\n        Eng->>DB: COMMIT\n    end\n    Note over Eng,DB: Every queued message is PENDING_APPROVAL. Nothing is transmitted<br/>by the scheduler. Human approval is required downstream.\n\n    HR->>Sch: POST /api/automation/trigger-run\n    HR->>Eng: require_roles([\"region_hr_head\",\"committee_hr_leader\",\"hr_admin\"])\n    Eng-->>HR: 200 { status, triggered_by, results }\n    HR->>DB: GET /api/automation/reminders (review queue)\n", "link": "rendered/01-flow-reminder-job.svg", "file": "01-flow-reminder-job.mmd"}, {"id": "01-flow-agent-chat", "title": "Agent chat request", "caption": "One full agent turn, deterministic branch and LLM fallback.", "src": "sequenceDiagram\n    autonumber\n    actor HR as HR Leader (browser)\n    participant SPA as AgentChat.tsx\n    participant API as POST /api/agent/stream\n    participant ReAct as ReActAgent\n    participant Tools as TOOL_REGISTRY\n    participant DB as Database\n    participant LLM as Groq / OpenRouter\n\n    HR->>SPA: \"Who was absent from today's meeting?\"\n    SPA->>API: POST /api/agent/stream (Bearer token)\n    API->>API: rate_limit_agent (25/min per IP)\n    API->>API: require_roles([...6 HR/lead roles])\n\n    API->>ReAct: is_deterministic_intent(query)\n    ReAct-->>API: true (matched \"absent\"/\"attendance\")\n\n    API->>ReAct: run_step(query, conversation_id, user_role, team_id, user_id)\n    ReAct->>ReAct: Build PermissionContext(user_id, role, team_id,<br/>is_admin_override, is_confirmed_action=False)\n    ReAct->>ReAct: state key = \"{user_id}:{conversation_id}\"\n\n    ReAct->>Tools: execute_tool(\"get_meeting_attendance\", {meeting_id:\"latest\"})\n    Tools->>Tools: Check TOOL_DEFINITIONS.required_roles vs context.role\n    alt Role not permitted\n        Tools-->>ReAct: { error: \"Unauthorized...\" }, FAILED\n    else Permitted\n        Tools->>Tools: Apply team scope (Student.team_id == context.team_id)\n        Tools->>DB: SELECT AttendanceRecord JOIN Student\n        Tools-->>ReAct: { summary, present_students, absent_students }, SUCCESS\n    end\n\n    ReAct->>DB: AuditService.record_action(QUERY_ATTENDANCE)\n    ReAct-->>API: AgentChatResponse(response, tool_executions, audit_id)\n\n    API-->>SPA: SSE event type=tool (tool_name, status, result)\n    loop Word by word\n        API-->>SPA: SSE event type=token (content)\n    end\n    API-->>SPA: SSE event type=done (requires_confirmation=false, audit_id)\n\n    Note over SPA,DB: Fallback path when is_deterministic_intent is false\n    API->>DB: CONVERSATION_STATE[\"{user_id}:{conversation_id}\"].history\n    API->>LLM: stream_groq (tier 1) -> OpenRouter (tier 2)\n    LLM-->>API: SSE data: chunks\n    API-->>SPA: SSE event type=token\n    API->>DB: AuditService.record_action(LLM_STREAM_CHAT, response truncated to 500 chars)\n    API-->>SPA: SSE event type=done\n", "link": "rendered/01-flow-agent-chat.svg", "file": "01-flow-agent-chat.mmd"}, {"id": "01-deployment", "title": "Deployment and infrastructure", "caption": "Where each piece runs and what can reach what.", "src": "flowchart TB\n    subgraph Prod[\"Production - Vercel Serverless\"]\n        V1[\"Vercel Edge Network<br/>TLS termination, HSTS\"]\n        V2[\"Static Assets<br/>frontend/dist SPA\"]\n        V3[\"Serverless Function<br/>api/index.py<br/>maxDuration 60s\"]\n        V4[\"Vercel Env Vars<br/>injected at runtime\"]\n    end\n\n    subgraph App[\"Application\"]\n        A1[\"FastAPI ASGI app<br/>app.main:app\"]\n        A2[\"SecurityHeadersMiddleware<br/>nosniff, DENY, CSP, HSTS\"]\n        A3[\"Uvicorn (local dev)\"]\n    end\n\n    subgraph DataTier[\"Data Tier\"]\n        D1[(\"Supabase PostgreSQL<br/>PgBouncer transaction pooler<br/>port 6543\")]\n        D2[(\"SQLite aiosqlite<br/>local dev only\")]\n    end\n\n    subgraph SelfHosted[\"Self-hosted Sidecar - never on Vercel\"]\n        S1[\"OpenWA Container<br/>openwa/wa-automate:latest<br/>port 2785\"]\n        S2[\"WhatsApp Web.js session<br/>volume openwa_data\"]\n        S3[\"Cloudflare Tunnel<br/>cloudflared tunnel run\"]\n    end\n\n    subgraph Third[\"Third-party APIs\"]\n        T1[\"Google Meet / Calendar API\"]\n        T2[\"Groq API\"]\n        T3[\"OpenRouter API\"]\n    end\n\n    V1 --> V2\n    V1 --> V3\n    V3 --> A1\n    A1 --> A2\n    V4 -.-> A1\n    A3 --> A1\n    A1 --> D1\n    A1 -.dev only.-> D2\n    A1 --> S1\n    S1 --> S2\n    S3 --> S1\n    A1 --> T1\n    A1 --> T2\n    A1 --> T3\n\n    note1[\"A1 cannot reach S1 from Vercel serverless.<br/>Self-hosted OpenWA must be exposed via<br/>the Cloudflare Tunnel, and OPENWA_API_URL<br/>must point at that public URL.\"]\n    A1 -.-> note1\n", "link": "rendered/01-deployment.svg", "file": "01-deployment.mmd"}]}, {"title": "02 — API", "doc": "docs/02-api.md", "diagrams": [{"id": "02-resource-map", "title": "Resource map", "caption": "All 64 paths grouped by router and how the resources chain together.", "src": "flowchart TB\n    subgraph Public[\"Public\"]\n        R0[\"GET /\"]\n        R1[\"POST /api/auth/register\"]\n        R2[\"POST /api/auth/login\"]\n        R3[\"POST /api/auth/refresh\"]\n        R4[\"POST /api/auth/logout\"]\n    end\n\n    subgraph Auth[\"Auth\"]\n        A1[\"GET /api/auth/me\"]\n        A2[\"GET /api/auth/teams\"]\n        A3[\"POST /api/auth/teams<br/>hr_admin\"]\n        A4[\"PATCH /api/auth/users/{user_id}/role<br/>hr_admin\"]\n        A5[\"POST /api/auth/link-student\"]\n        A6[\"POST /api/auth/logout-all\"]\n    end\n\n    subgraph Students[\"Students\"]\n        S1[\"GET /api/students\"]\n        S2[\"POST /api/students\"]\n        S3[\"GET /api/students/scoreboard/all\"]\n        S4[\"GET /api/students/{student_id}\"]\n        S5[\"GET /api/students/{student_id}/score\"]\n        S6[\"PUT /api/students/{student_id}/behavior-score\"]\n        S7[\"POST /api/students/assign-cohort\"]\n        S8[\"PATCH /api/students/{student_id}/phone\"]\n        S9[\"POST /api/students/{student_id}/bonus\"]\n        S10[\"POST /api/students/{student_id}/invitation\"]\n    end\n\n    subgraph Tasks[\"Tasks\"]\n        T1[\"GET /api/tasks\"]\n        T2[\"POST /api/tasks\"]\n        T3[\"GET /api/tasks/{task_id}\"]\n        T4[\"POST /api/tasks/{task_id}/assign\"]\n        T5[\"GET /api/tasks/{task_id}/scores\"]\n        T6[\"GET /api/tasks/{task_id}/submissions\"]\n        T7[\"GET /api/tasks/submissions/{submission_id}\"]\n        T8[\"GET /api/tasks/submissions/{submission_id}/score\"]\n        T9[\"PUT /api/tasks/submissions/{submission_id}/review\"]\n        T10[\"POST /api/tasks/{task_id}/submit\"]\n    end\n\n    subgraph Attendance[\"Attendance\"]\n        AT1[\"GET /api/attendance/meetings\"]\n        AT2[\"POST /api/attendance/meetings\"]\n        AT3[\"GET /api/attendance/meetings/{meeting_id}\"]\n        AT4[\"POST /api/attendance/meetings/{meeting_id}/process\"]\n        AT5[\"PUT /api/attendance/meetings/{meeting_id}/records/{student_id}/status\"]\n    end\n\n    subgraph AgentR[\"Agent\"]\n        G1[\"POST /api/agent/chat\"]\n        G2[\"POST /api/agent/stream<br/>SSE\"]\n        G3[\"POST /api/agent/confirm<br/>HITL\"]\n        G4[\"GET /api/agent/tools\"]\n    end\n\n    subgraph Whats[\"WhatsApp\"]\n        W1[\"GET /api/whatsapp/status\"]\n        W2[\"GET /api/whatsapp/qr\"]\n        W3[\"POST /api/whatsapp/send-official\"]\n        W4[\"POST /api/whatsapp/generate-link\"]\n        W5[\"GET /api/whatsapp/escalations\"]\n        W6[\"GET /api/whatsapp/threads\"]\n        W7[\"GET /api/whatsapp/threads/{sid}/messages\"]\n        W8[\"POST /api/whatsapp/threads/{sid}/messages\"]\n        W9[\"POST /api/whatsapp/threads/{student_id}/sync\"]\n        W10[\"POST /api/whatsapp/threads/{student_id}/media\"]\n        W11[\"POST /api/whatsapp/threads/{student_id}/messages/{message_id}/reaction\"]\n        W12[\"PUT /api/whatsapp/threads/{student_id}/messages/{message_id}\"]\n        W13[\"POST /api/whatsapp/webhook<br/>X-Webhook-Secret\"]\n        W14[\"WS /api/whatsapp/ws?token=\"]\n    end\n\n    subgraph Ops[\"Operations\"]\n        O1[\"GET /api/automation/settings\"]\n        O2[\"PUT /api/automation/settings\"]\n        O3[\"POST /api/automation/trigger-run\"]\n        O4[\"GET /api/automation/reminders\"]\n        O5[\"GET /api/automation/logs\"]\n        O6[\"GET /api/automation/reminders/{reminder_id}\"]\n        O7[\"GET /api/audit/logs<br/>hr_admin\"]\n        O8[\"GET /api/dashboard/stats\"]\n        O9[\"GET /api/calendar/events\"]\n        O10[\"POST /api/calendar/events\"]\n    end\n\n    subgraph Comms[\"Communications\"]\n        C1[\"POST /api/feedback\"]\n        C2[\"GET /api/feedback\"]\n        C3[\"PATCH /api/feedback/{feedback_id}/status\"]\n        C4[\"POST /api/questions\"]\n        C5[\"GET /api/questions\"]\n        C6[\"POST /api/questions/{question_id}/answer\"]\n        C7[\"GET /api/reports/committee/summary\"]\n        C8[\"POST /api/reports/submit-to-head\"]\n        C9[\"GET /api/reports\"]\n        C10[\"POST /api/reports/{report_id}/acknowledge\"]\n    end\n\n    R2 --> A1\n    A1 --> S1\n    S1 --> S3\n    S1 --> T1\n    T1 --> T3\n    T3 --> T7\n    T7 --> T9\n    AT1 --> AT3\n    AT3 --> AT4\n    AT4 --> AT5\n    S1 --> G1\n    G1 --> G2\n    G2 --> G3\n    G4 -.introspects.-> G1\n    S1 --> W6\n    W6 --> W7\n    W7 --> W8\n    W8 --> W9\n    W9 --> W14\n    W13 --> W14\n    S1 --> O1\n    O1 --> O3\n    O3 --> O4\n    S1 --> C1\n    C1 --> C2\n    C2 --> C3\n    C4 --> C5\n    C5 --> C6\n    C7 --> C8\n    C8 --> C9\n    C9 --> C10\n    W1 --> W2\n    W2 --> W3\n    O1 --> O9", "link": "rendered/02-resource-map.svg", "file": "02-resource-map.mmd"}, {"id": "02-auth-sequence", "title": "Per-request authentication", "caption": "What get_current_user does on every protected call.", "src": "sequenceDiagram\n    autonumber\n    actor Client as Client\n    participant API as FastAPI\n    participant OAuth as oauth2_scheme\n    participant Sec as core/security.py\n    participant DB as Database\n\n    Client->>API: Any protected request\n    API->>OAuth: get_current_user(token, db)\n    OAuth-->>API: None when Authorization header absent\n    Note over API: No header -> 401 \"Authentication required\"\n\n    API->>Sec: decode_token(token)\n    alt Token signature invalid\n        Sec-->>API: jwt.PyJWTError\n        API-->>Client: 401 \"Could not validate credentials\" + WWW-Authenticate: Bearer\n    else Token expired\n        Sec-->>API: jwt.ExpiredSignatureError\n        API-->>Client: 401 \"Token has expired. Please log in again or refresh your session.\"\n    end\n\n    Sec-->>API: payload { sub, email, role, team_id, type, exp, iat }\n    API->>API: Require payload.type == \"access\"\n    alt Refresh token used as access token\n        API-->>Client: 401 credentials_exception\n    end\n\n    API->>DB: SELECT User WHERE id = payload.sub (selectinload team)\n    alt User row missing\n        API-->>Client: 401 \"User account no longer exists.\"\n    end\n\n    API->>API: get_current_active_user -> require is_active\n    alt user.is_active == false\n        API-->>Client: 403 \"User account is deactivated.\"\n    end\n\n    API-->>Client: Current User object to the route handler\n\n    Note over API,DB: No token revocation check on access tokens.<br/>Access tokens live ACCESS_TOKEN_EXPIRE_MINUTES and are stateless.<br/>Only refresh tokens are tracked in refresh_sessions and revocable.\n", "link": "rendered/02-auth-sequence.svg", "file": "02-auth-sequence.mmd"}, {"id": "02-flow-hitl-reminder", "title": "HITL reminder flow", "caption": "Draft, confirm, send. Replay and concurrency guards.", "src": "sequenceDiagram\n    autonumber\n    actor HR as HR Leader\n    participant SPA as AgentChat.tsx\n    participant Stream as POST /api/agent/stream\n    participant ReAct as ReActAgent\n    participant Audit as agent_action_audits\n    participant Conf as POST /api/agent/confirm\n    participant Tool as tool_send_reminder\n    participant Prov as MessagingProvider\n\n    HR->>SPA: \"Remind the absent members\"\n    SPA->>Stream: POST /api/agent/stream\n    Stream->>ReAct: run_step\n\n    ReAct->>ReAct: INTENT 1B get_meeting_attendance\n    ReAct->>ReAct: state.last_absent_student_ids populated\n    ReAct->>ReAct: get_upcoming_meetings(limit 3)\n    ReAct->>ReAct: prepare_reminder(student_ids, event_id)\n    ReAct->>ReAct: action_id = act_rem_{epoch_ms}\n\n    ReAct->>Audit: INSERT status=PENDING_CONFIRMATION,<br/>requires_confirmation=true, confirmed=false\n    ReAct-->>Stream: requires_confirmation=true + PendingConfirmation\n\n    Stream-->>SPA: SSE type=tool (get_upcoming_meetings, prepare_reminder)\n    Stream-->>SPA: SSE type=token (message preview)\n    Stream-->>SPA: SSE type=done (pending_confirmation.action_id)\n\n    Note over SPA,Conf: Stream is now closed. The UI renders a Confirm and Send button.\n    HR->>Conf: POST /api/agent/confirm { action_id, confirmed: true }\n    Conf->>Audit: SELECT WHERE action_id\n\n    alt Row missing\n        Conf-->>HR: 404 Pending action not found\n    else status != PENDING_CONFIRMATION or already confirmed\n        Conf-->>HR: 400 \"is not pending confirmation\"\n    end\n\n    Conf->>Conf: Parse parameters JSON, extract student_ids\n    Conf->>Conf: For committee roles, reject if any target student<br/>is outside caller.team_id\n    alt Cross-team target\n        Conf-->>HR: 403 \"Cannot confirm actions targeting members outside your assigned team\"\n    end\n\n    Conf->>Audit: UPDATE ... SET status = EXECUTING_CONFIRMATION<br/>WHERE status = PENDING_CONFIRMATION\n    alt rowcount == 0 (concurrent request)\n        Conf-->>HR: 409 \"already being confirmed or has been modified\"\n    end\n\n    Conf->>Tool: tool_send_reminder(is_confirmed=True)\n    Tool->>Tool: Re-apply team scope filter to student_ids\n    Tool->>Prov: send_batch(OutgoingMessage[])\n    Prov-->>Tool: [MessageDeliveryResult]\n    Tool->>Tool: INSERT ReminderLog rows, set status per result\n\n    Conf->>Audit: UPDATE status = EXECUTED, confirmed = true,<br/>user_id = caller, result = json\n    Conf-->>HR: 200 { status: EXECUTED, result: { sent_count } }\n\n    opt User cancels\n        HR->>Conf: POST /api/agent/confirm { action_id, confirmed: false }\n        Conf->>Audit: UPDATE status = REJECTED\n        Conf-->>HR: 200 { status: REJECTED }\n    end\n", "link": "rendered/02-flow-hitl-reminder.svg", "file": "02-flow-hitl-reminder.mmd"}, {"id": "02-flow-sse-stream", "title": "SSE streaming", "caption": "Event ordering, provider cascade, client termination.", "src": "sequenceDiagram\n    autonumber\n    actor HR as HR Leader\n    participant SPA as AgentChat.tsx\n    participant API as POST /api/agent/stream\n    participant ReAct as ReActAgent\n    participant LLM as Groq\n    participant OR as OpenRouter\n    participant Audit as agent_action_audits\n\n    SPA->>API: fetch with ReadableStream reader\n    API-->>SPA: HTTP 200 text/event-stream\n    Note right of API: Headers: Cache-Control no-cache,<br/>X-Accel-Buffering no, Connection keep-alive\n\n    API->>ReAct: is_deterministic_intent(query)\n    ReAct-->>API: false\n\n    API->>ReAct: CONVERSATION_STATE[\"{user_id}:{conversation_id}\"]\n    ReAct->>ReAct: history.append({ role: \"user\", content: query })\n\n    API->>LLM: Tier 1 POST /chat/completions (stream true, timeout 45s)\n    alt LLM yields tokens\n        loop Each SSE data: chunk\n            LLM-->>API: choices[0].delta.content\n            API-->>SPA: data: {\"type\":\"token\",\"content\":\"...\"}\n        end\n    else LLM errors or returns 0 tokens\n        API->>OR: Tier 2 POST /chat/completions (stream true, timeout 45s)\n        alt OpenRouter returns 200\n            loop Each SSE data: chunk\n                OR-->>API: choices[0].delta.content\n                API-->>SPA: data: {\"type\":\"token\",\"content\":\"...\"}\n            end\n        else OpenRouter 429 or exception\n            API->>LLM: Tier 2b retry Groq once\n        end\n    end\n\n    alt All providers unavailable\n        API-->>SPA: Tier 3 local deterministic text, word by word\n    end\n\n    API->>ReAct: history.append({ role: \"assistant\", ... })\n    ReAct->>ReAct: state[\"history\"] = history[-20:]\n    API->>Audit: INSERT LLM_STREAM_CHAT (response truncated to 500 chars)\n    API-->>SPA: data: {\"type\":\"done\",\"requires_confirmation\":false,\"audit_id\":null}\n\n    Note over SPA: Frontend buffers tokens and flushes on a 40ms timer.<br/>On type=tool it appends a tool trace chip.<br/>On type=error it marks the message failed.\n", "link": "rendered/02-flow-sse-stream.svg", "file": "02-flow-sse-stream.mmd"}, {"id": "02-flow-whatsapp-webhook", "title": "WhatsApp webhook and WebSocket", "caption": "Inbound message routing to the assigned HR socket.", "src": "sequenceDiagram\n    autonumber\n    participant OpenWA as OpenWA Gateway\n    participant Hook as POST /api/whatsapp/webhook\n    participant Svc as WhatsAppService\n    participant DB as Database\n    participant MGR as ws_manager\n    actor HR as HR Member (browser)\n\n    OpenWA->>Hook: event message.received\n    Hook->>Hook: Compare X-Webhook-Secret against OPENWA_WEBHOOK_SECRET\n    alt Secret missing or unconfigured\n        Hook-->>OpenWA: 401\n    else Secret mismatch\n        Hook-->>OpenWA: 403\n    end\n    Hook->>Hook: Parse JSON body\n    Hook->>Svc: handle_webhook_event(payload, db)\n\n    Svc->>DB: Normalize sender phone to E.164\n    Svc->>DB: SELECT Student WHERE phone matches\n    alt No matching student\n        Svc-->>Hook: 200 (ignored, logged)\n    end\n    Svc->>DB: SELECT student.assigned_hr_id\n    Svc->>DB: SELECT existing message by openwa_message_id\n    alt Message already stored\n        Svc->>DB: UPDATE status/ack (idempotent upsert)\n    else New message\n        Svc->>DB: INSERT WhatsAppChatMessage(sender_type=STUDENT, status=pending)\n    end\n    Svc->>MGR: push event to assigned HR socket\n    MGR-->>HR: WebSocket frame with new message\n    Svc-->>Hook: 200\n\n    Note over Hook,Svc: Also handles onAck (delivery/read receipts),<br/>onReaction, and onMessageEdit events.\n\n    HR->>Hook: WSS /api/whatsapp/ws?token={JWT}\n    Hook->>Hook: decode_token, load User, require role in<br/>{committee_hr_member, committee_hr_leader,<br/>region_hr_head, hr_admin}\n    alt Invalid or unauthorized\n        Hook-->>HR: close 1008 Policy Violation\n    end\n    Hook-->>HR: accept\n    loop Keepalive\n        HR->>Hook: \"ping\"\n        Hook-->>HR: \"pong\"\n    end\n", "link": "rendered/02-flow-whatsapp-webhook.svg", "file": "02-flow-whatsapp-webhook.mmd"}]}, {"title": "03 — AI Agent", "doc": "docs/03-ai-agent.md", "diagrams": [{"id": "03-intent-routing", "title": "Request flow and intent routing", "caption": "Every step from HTTP entry to response, with the provider cascade.", "src": "flowchart TB\n    START[\"POST /api/agent/chat or /api/stream\"] --> AUTH[\"get_current_active_user<br/>is_active check\"]\n    AUTH --> RBAC{\"require_roles<br/>6 HR and leadership roles\"}\n    RBAC -->|deny| E403[\"403 Access forbidden\"]\n    RBAC -->|allow| RL[\"rate_limit_agent<br/>25 requests / 60s per IP\"]\n    RL --> CTX[\"Build PermissionContext<br/>user_id, role, team_id,<br/>is_admin_override, is_confirmed_action=False<br/>frozen Pydantic model\"]\n\n    CTX --> STATE[\"CONVERSATION_STATE key =<br/>'{user_id}:{conversation_id}'<br/>LRU 1000 entries, TTL 24h\"]\n\n    STATE --> DET{\"is_deterministic_intent(query)?\"}\n\n    DET -->|Greeting| G[\"Static bilingual greeting\"]\n    DET -->|Help| H[\"Static capability list\"]\n    DET -->|Stats| S1[\"get_meeting_attendance<br/>get_upcoming_events\"]\n    DET -->|Attendance| S2[\"extract_student_attendance_query<br/>get_student_attendance or<br/>get_meeting_attendance\"]\n    DET -->|Reminder| S3[\"get_upcoming_meetings<br/>prepare_reminder<br/>HITL PENDING_CONFIRMATION\"]\n    DET -->|Score| S4[\"extract_student_query<br/>tool_get_student identity resolve<br/>get_student_score\"]\n    DET -->|Task| S5[\"get_pending_submissions\"]\n    DET -->|Calendar| S6[\"get_upcoming_events\"]\n    DET -->|No match| LLM[\"call_openrouter or stream_openrouter\"]\n\n    LLM --> T1[\"Tier 1 Groq\"]\n    T1 -->|error or 0 tokens| T2[\"Tier 2 OpenRouter\"]\n    T2 -->|429 or error| T3[\"Tier 2b Groq retry\"]\n    T3 -->|unavailable| T4[\"Tier 3 Local deterministic text\"]\n\n    S1 --> AUTHZ\n    S2 --> AUTHZ\n    S3 --> HITLGATE\n    S4 --> AUTHZ\n    S5 --> AUTHZ\n    S6 --> AUTHZ\n\n    AUTHZ{\"execute_tool:<br/>role in TOOL_DEFINITIONS.required_roles<br/>AND context.is_admin_override?\"}\n    AUTHZ -->|deny| EF[\"{ error: Unauthorized }, FAILED\"]\n    AUTHZ -->|allow| SCOPE[\"Team scope filter applied inside handler\"]\n    SCOPE --> AUD[(\"AuditService.record_action\")]\n    EF --> AUD\n    AUD --> RESP[\"AgentChatResponse\"]\n\n    HITLGATE[\"tool_send_reminder without confirmation\"] --> HITC{\"context.is_confirmed_action?\"}\n    HITC -->|false| PREP[\"tool_prepare_reminder<br/>REQUIRES_CONFIRMATION\"]\n    HITC -->|true via /api/agent/confirm| SEND[\"provider.send_batch\"]\n    PREP --> AUD\n    SEND --> RESP\n\n    RESP --> END[\"SSE type=done or JSON response\"]\n", "link": "rendered/03-intent-routing.svg", "file": "03-intent-routing.mmd"}, {"id": "03-react-loop", "title": "The three execution paths", "caption": "Deterministic, LLM fallback, and HITL.", "src": "sequenceDiagram\n    autonumber\n    actor HR as HR Leader\n    participant Agent as Agent (chat/stream)\n    participant ReAct as ReActAgent.run_step\n    participant Tools as Tool handlers\n    participant Hitl as /agent/confirm\n    participant DB as Database\n    participant Audit as AgentActionAudit\n\n    Note over ReAct: CLASSIFICATION - is_deterministic_intent(query)<br/>Keyword match on EN + AR tokens\n\n    rect rgb(240, 247, 255)\n        Note over ReAct,Audit: DETERMINISTIC PATH - no LLM called\n        ReAct->>Tools: execute_tool(name, params, db, context)\n        Tools->>Tools: Verify required_roles contains context.role\n        Tools->>Tools: Apply team scope filter on every query\n        Tools->>DB: SELECT / aggregate\n        Tools-->>ReAct: { result }, SUCCESS | FAILED | PENDING_CONFIRMATION\n        ReAct->>Audit: record_action(intent, tool_name, params, result, user_id)\n        ReAct-->>Agent: AgentChatResponse with formatted EN or AR text\n    end\n\n    rect rgb(255, 247, 237)\n        Note over ReAct,Audit: LLM FALLBACK PATH\n        ReAct->>ReAct: state[\"history\"][-20:] conversation memory\n        ReAct->>ReAct: call_openrouter(history, system_prompt)\n        Note over ReAct: System prompt forbids fabricating student data and<br/>directs users to specific commands for real data.\n        ReAct-->>Agent: LLM text\n        ReAct->>Audit: record_action(LLM_CHAT, response[:500])\n        ReAct-->>Agent: AgentChatResponse(tool_executions = [])\n    end\n\n    rect rgb(254, 242, 242)\n        Note over ReAct,DB: EXTERNAL ACTION PATH - requires human confirmation\n        ReAct->>Tools: tool_prepare_reminder(...) - read only, no side effect\n        Tools-->>ReAct: { message_preview, recipients, target_count }\n        ReAct->>Audit: INSERT PENDING_CONFIRMATION, confirmed=false\n        ReAct-->>Agent: requires_confirmation = true, pending_confirmation.action_id\n        Note over Hitl,DB: Stream terminates here. No message is transmitted.\n        HR->>Hitl: POST /agent/confirm { action_id, confirmed }\n        Hitl->>DB: Atomic UPDATE ... WHERE status = PENDING_CONFIRMATION\n        alt rowcount == 0\n            Hitl-->>HR: 409 Conflict\n        end\n        Hitl->>Tools: tool_send_reminder(is_confirmed = true)\n        Tools->>DB: Re-scope student_ids to caller team\n        Tools->>Tools: provider.send_batch(...)\n        Hitl->>DB: UPDATE status = EXECUTED, result = json\n        Hitl-->>HR: 200 { sent_count }\n    end\n", "link": "rendered/03-react-loop.svg", "file": "03-react-loop.mmd"}, {"id": "03-tool-resource-map", "title": "Tool to resource map", "caption": "Which tool touches which table, and the read/write split.", "src": "flowchart LR\n    subgraph ReadOnly[\"READ_ONLY tools\"]\n        T1[\"get_student\"]\n        T2[\"search_students\"]\n        T3[\"list_students\"]\n        T4[\"get_student_contacts\"]\n        T5[\"get_upcoming_meetings\"]\n        T6[\"get_meeting\"]\n        T7[\"get_meeting_attendance\"]\n        T8[\"get_student_attendance\"]\n        T9[\"get_upcoming_events\"]\n        T10[\"get_tasks\"]\n        T11[\"get_pending_submissions\"]\n        T12[\"get_student_score\"]\n        T13[\"get_scores\"]\n        T14[\"prepare_reminder\"]\n    end\n\n    subgraph External[\"EXTERNAL_ACTION tools\"]\n        T15[\"send_reminder<br/>requires confirmation\"]\n    end\n\n    subgraph Tables[\"Tables read\"]\n        DB1[(\"students\")]\n        DB2[(\"teams\")]\n        DB3[(\"meetings\")]\n        DB4[(\"attendance_records\")]\n        DB5[(\"participant_sessions\")]\n        DB6[(\"tasks\")]\n        DB7[(\"submissions\")]\n        DB8[(\"score_records\")]\n        DB9[(\"events\")]\n        DB10[(\"agent_action_audits\")]\n        DB11[(\"reminder_logs\")]\n    end\n\n    subgraph ExternalSys[\"External calls\"]\n        X1[\"ScoringService\"]\n        X2[\"CalendarService / MockCalendarProvider\"]\n        X3[\"ReminderService / MessagingProvider\"]\n    end\n\n    T1 --> DB1\n    T2 --> DB1\n    T3 --> DB1\n    T4 --> DB1\n    T5 --> DB3\n    T6 --> DB3\n    T7 --> DB4\n    T7 --> DB1\n    T8 --> DB4\n    T8 --> DB3\n    T9 --> DB9\n    T9 --> X2\n    T10 --> DB6\n    T11 --> DB7\n    T11 --> DB1\n    T12 --> DB8\n    T12 --> DB4\n    T12 --> DB7\n    T13 --> DB8\n    T13 --> DB1\n    T14 --> DB1\n    T14 --> X2\n    T15 --> DB1\n    T15 --> DB3\n    T15 --> X3\n    T15 --> DB11\n\n    note[\"No agent tool writes to students, tasks, submissions,<br/>score_records, or attendance_records. Every write in the system<br/>goes through a REST endpoint gated by require_roles.\"]\n\n    classDef ro fill:#f0fdf4,stroke:#15803d,color:#14532d\n    classDef ex fill:#fef2f2,stroke:#b91c1c,color:#7f1d1d\n    class T1,T2,T3,T4,T5,T6,T7,T8,T9,T10,T11,T12,T13,T14 ro\n    class T15 ex\n", "link": "rendered/03-tool-resource-map.svg", "file": "03-tool-resource-map.mmd"}]}, {"title": "04 — Authorization", "doc": "docs/04-authorization.md", "diagrams": [{"id": "04-token-flow", "title": "Token lifecycle", "caption": "Login, validation, rotation, reuse detection, logout.", "src": "flowchart TB\n    L[\"POST /api/auth/login<br/>rate_limit_login 60/min\"] --> V1[\"Lookup candidates:<br/>exact identifier, or<br/>identifier + @studentops.org\"]\n    V1 --> V2{\"User found AND<br/>bcrypt.verify?\"}\n    V2 -->|no| E401[\"401 Incorrect email or password\"]\n    V2 -->|yes| V3{\"user.is_active?\"}\n    V3 -->|no| E403[\"403 Account deactivated\"]\n    V3 -->|yes| TOK[\"Issue access JWT (type=access)<br/>Issue refresh JWT (type=refresh, jti=uuid4)\"]\n    TOK --> SESS[\"INSERT RefreshSession(refresh_token_jti, expires_at)\"]\n    SESS --> RET[\"200 TokenResponse\"]\n\n    RET --> USE[\"Client stores access_token in localStorage<br/>key: studentops_access_token\"]\n    USE --> CALL[\"Authorization: Bearer {access_token}\"]\n    CALL --> DEC{\"decode_token<br/>expired?\"}\n    DEC -->|yes| R401[\"401 Token has expired\"]\n    DEC -->|no| T{\"type == access?\"}\n    T -->|no| R401b[\"401 Could not validate credentials\"]\n    T -->|yes| OK[\"Route handler runs\"]\n\n    OK --> EXP{\"access_token expired<br/>or logout?\"}\n    EXP -->|refresh needed| RF[\"POST /api/auth/refresh\"]\n    RF --> S1{\"RefreshSession found by jti?\"}\n    S1 -->|no| F401[\"401 Refresh session not found\"]\n    S1 -->|yes| S2{\"session.revoked_at set?\"}\n    S2 -->|yes| REUSE[\"REUSE DETECTED<br/>Revoke ALL sessions for user<br/>401 Token reuse detected\"]\n    S2 -->|no| S3{\"user still active?\"}\n    S3 -->|no| F401b[\"401 User account no longer active\"]\n    S3 -->|yes| ROT[\"Revoke old session.<br/>Issue new access + refresh.<br/>INSERT new RefreshSession\"]\n    ROT --> RET2[\"200 TokenResponse (rotated pair)\"]\n\n    OK --> LOG[\"POST /api/auth/logout\"]\n    LOG --> REV[\"Set revoked_at on the supplied jti.<br/>Access token remains valid until expiry.\"]\n", "link": "rendered/04-token-flow.svg", "file": "04-token-flow.mmd"}, {"id": "04-role-hierarchy", "title": "Role hierarchy", "caption": "Delegation and reporting lines.", "src": "flowchart TB\n    R1[\"region_hr_head<br/>Regional HR Head / Vice HR\"]\n    R2[\"hr_admin<br/>HR Administrator (legacy, system-wide)\"]\n    R3[\"committee_hr_leader<br/>Committee HR Leader\"]\n    R4[\"committee_head<br/>Committee Head (Technical)\"]\n    R4 -.equivalence.-> R4B[\"team_lead<br/>Team Lead (legacy alias)\"]\n    R5[\"committee_hr_member<br/>Committee HR Member\"]\n    R6[\"committee_member<br/>Committee Member\"]\n    R6 -.equivalence.-> R6B[\"member<br/>Member (legacy alias)\"]\n\n    R1 -->|delegates| R3\n    R3 -->|oversees| R5\n    R5 -->|handles cohort| R6\n    R3 -->|escalates reports to| R1\n    R1 -->|acknowledges reports from| R3\n\n    R2 --- R1\n\n    classDef reg fill:#ede9fe,stroke:#6d28d9,color:#2e1065\n    classDef lead fill:#dbeafe,stroke:#1d4ed8,color:#1e3a8a\n    classDef tech fill:#dcfce7,stroke:#15803d,color:#14532d\n    classDef hrm fill:#fef3c7,stroke:#b45309,color:#78350f\n    classDef mem fill:#f1f5f9,stroke:#475569,color:#0f172a\n    class R1,R2 reg\n    class R3 lead\n    class R4,R4B tech\n    class R5 hrm\n    class R6,R6B mem\n", "link": "rendered/04-role-hierarchy.svg", "file": "04-role-hierarchy.mmd"}, {"id": "04-authz-decision", "title": "Authorization decision flow", "caption": "The three independent enforcement layers.", "src": "flowchart TB\n    REQ[\"Incoming request\"] --> AUTHZ{\"Authorization header<br/>present and valid?\"}\n    AUTHZ -->|no| R401[\"401\"]\n    AUTHZ -->|yes| LOAD[\"Load User row with eager team\"]\n    LOAD --> ACTIVE{\"is_active?\"}\n    ACTIVE -->|no| R403A[\"403 Deactivated\"]\n    ACTIVE -->|yes| ROLE{\"Role guard<br/>require_roles([...])\"}\n\n    ROLE -->|role not in list| R403B[\"403 Access forbidden:<br/>requires one of roles [...]\"]\n\n    ROLE -->|allowed| FUNC{\"Handler-specific<br/>resource check\"}\n\n    FUNC --> F1{\"verify_student_access<br/>student_id, mode\"}\n    F1 --> F1A[\"region_hr_head / hr_admin<br/>ALLOW all students\"]\n    F1 --> F1B[\"committee_head / hr_leader / team_lead<br/>ALLOW if student.team_id == caller.team_id\"]\n    F1 --> F1C[\"committee_hr_member<br/>write: assigned_hr_id == caller.id<br/>read: assigned OR same team\"]\n    F1 --> F1D[\"committee_member / member<br/>ALLOW only student.id == caller.student_id\"]\n    F1 --> F1A & F1B & F1C & F1D\n\n    FUNC --> F2{\"Query-level team filter<br/>Student.team_id == caller.team_id\"}\n    FUNC --> F3{\"Explicit field redaction<br/>scores set to null\"}\n    FUNC --> F4{\"Business rule gate<br/>e.g. committee_member blocked from /score\"}\n\n    F1B --> DENY[\"403 Forbidden\"]\n    F1C --> DENY\n    F1D --> DENY\n    F2 --> EMPTY[\"Empty result set (fail closed)\"]\n    F3 --> REDACT[\"200 with sensitive fields nulled\"]\n    F4 --> DENY\n\n    F1A --> OK[\"200 Response\"]\n    REDACT --> OK\n    EMPTY --> OK\n\n    note[\"Layering: three independent checks.<br/>1. require_roles - coarse role gate per endpoint.<br/>2. verify_student_access / inline team_id comparison - object gate.<br/>3. Query WHERE clause - row gate.<br/>Frontend NAV_ITEMS roles is NOT a security boundary.\"]\n    REQ -.-> note\n", "link": "rendered/04-authz-decision.svg", "file": "04-authz-decision.mmd"}, {"id": "04-who-sees-what", "title": "Who sees what", "caption": "Field-level and record-level visibility per role.", "src": "flowchart TB\n    subgraph Who[\"Who sees what\"]\n\n    subgraph Region[\"region_hr_head / hr_admin\"]\n        RA1[\"Students: all committees\"]\n        RA2[\"Scores: full scoreboard\"]\n        RA3[\"Attendance: all meetings\"]\n        RA4[\"Tasks: scores only, NOT submissions\"]\n        RA5[\"Feedback: read-only oversight\"]\n        RA6[\"Reports: list + acknowledge\"]\n        RA7[\"Audit logs: yes\"]\n        RA8[\"WhatsApp: oversight=true, all threads\"]\n        RA9[\"Role management: hr_admin only\"]\n    end\n\n    subgraph Leader[\"committee_hr_leader\"]\n        CL1[\"Students: own team_id only\"]\n        CL2[\"Scores: own team cohort\"]\n        CL3[\"Attendance: own team\"]\n        CL4[\"Tasks: scores only, NOT submissions\"]\n        CL5[\"Feedback: full content, own team, can action\"]\n        CL6[\"Reports: own team, submit upward\"]\n        CL7[\"Audit logs: no\"]\n        CL8[\"WhatsApp: oversight=true, own team\"]\n        CL9[\"Cohort assignment: yes\"]\n    end\n\n    subgraph Head[\"committee_head / team_lead\"]\n        CH1[\"Students: own team only\"]\n        CH2[\"Scores: VIEW ONLY, cannot write\"]\n        CH3[\"Attendance: own team\"]\n        CH4[\"Tasks: full submissions, can review and grade\"]\n        CH5[\"Feedback: BLOCKED 403\"]\n        CH6[\"Reports: blocked\"]\n        CH7[\"Audit logs: no\"]\n        CH8[\"Q and A: can answer\"]\n    end\n\n    subgraph Hrm[\"committee_hr_member\"]\n        HM1[\"Students: assigned cohort or own team\"]\n        HM2[\"Scores: own cohort, can WRITE behavior /23\"]\n        HM3[\"Attendance: own team, can process and correct\"]\n        HM4[\"Tasks: scores only, NOT submissions\"]\n        HM5[\"Feedback: BLOCKED 403\"]\n        HM6[\"Escalations: own flags only\"]\n        HM7[\"WhatsApp: assigned students only\"]\n    end\n\n    subgraph Member[\"committee_member / member\"]\n        M1[\"Students: own record only\"]\n        M2[\"Scores: scoreboard BLOCKED 403.<br/>Own /{id}/score returns own only\"]\n        M3[\"Attendance: own record only, no max_score\"]\n        M4[\"Tasks: own submissions, scores redacted to null\"]\n        M5[\"Feedback: submit + own feedback\"]\n        M6[\"Q and A: ask and view own\"]\n        M7[\"Agent: BLOCKED 403\"]\n        M8[\"Reminders: own only\"]\n    end\n    end\n\n    NOTE[\"Redaction, not just filtering: committee members receive a 200 with<br/>score, technical_score, reviewer_notes, graded_by_user_id and<br/>max_score explicitly set to null by the server.\"]\n    M2 -.-> NOTE\n    M4 -.-> NOTE\n", "link": "rendered/04-who-sees-what.svg", "file": "04-who-sees-what.mmd"}, {"id": "04-escalation-flow", "title": "Escalation logic", "caption": "The exact SLA rule, with three missing pieces marked.", "src": "flowchart TB\n    subgraph Abs[\"Absenteeism path\"]\n        A1[\"AttendanceRecord.status = UNEXCUSED_ABSENT\"] --> A2[\"INSERT MemberFollowupStatus<br/>flagged_reason = ABSENT_{meeting_code}<br/>status = PENDING, is_escalated = false\"]\n        A2 --> A3[\"hr_member_id = student.assigned_hr_id<br/>fallback: committee_hr_leader of the team\"]\n    end\n\n    subgraph Task[\"Overdue task path\"]\n        T1[\"run_task_cycle stage 2<br/>now >= deadline + task_post_delay_hours\"] --> T2[\"get_task_reminder_candidates\"]\n        T2 --> T3{\"student.assigned_hr_id present?\"}\n        T3 -->|yes| T4[\"INSERT MemberFollowupStatus<br/>flagged_reason = OVERDUE_TASK<br/>status = PENDING, is_escalated = false\"]\n    end\n\n    subgraph Contact[\"Contact event\"]\n        C1[\"POST /api/whatsapp/generate-link\"] --> C2{\"PENDING flag for this student?\"}\n        C2 -->|yes| C3[\"SET last_contacted_at = utcnow()<br/>SET status = CONTACTED\"]\n    end\n\n    subgraph Escalate[\"Escalation evaluation - read only\"]\n        E1[\"GET /api/whatsapp/escalations\"] --> E2[\"days_open = (utcnow - flagged_at).days\"]\n        E2 --> E3{\"days_open >= 3<br/>AND status != RESOLVED?\"}\n        E3 -->|yes| E4[\"Response field is_escalated = true<br/>(computed in the serializer)\"]\n    end\n\n    A3 --> E1\n    T4 --> E1\n    C3 --> E1\n\n    GAP1[\"GAP: status is never set to ESCALATED and is_escalated column<br/>is never set to true by application code.<br/>routes_reports.py counts status IN (PENDING, ESCALATED)<br/>so the aggregate always collapses to PENDING.\"]\n    E4 -.-> GAP1\n    GAP1 --> GAP2[\"GAP: no notification is emitted.<br/>There is no outbound message, email or WebSocket push<br/>when a follow-up breaches the 3 day SLA.\"]\n    GAP2 --> GAP3[\"GAP: no RESOLVED transition path exists.<br/>No endpoint sets status = RESOLVED.\"]\n\n    E4 --> VIS[\"Visible to: committee_hr_leader (team),<br/>region_hr_head / hr_admin (all),<br/>committee_hr_member (own flags only)\"]\n\n    classDef gap fill:#fef2f2,stroke:#b91c1c,color:#7f1d1d,stroke-dasharray: 5 5\n    class GAP1,GAP2,GAP3 gap\n", "link": "rendered/04-escalation-flow.svg", "file": "04-escalation-flow.mmd"}]}, {"title": "05 — Database", "doc": "docs/05-database.md", "diagrams": [{"id": "05-er-diagram", "title": "Entity relationship diagram", "caption": "All 23 tables with PKs, FKs, and cardinalities.", "src": "erDiagram\n    TEAMS ||--o{ USERS : \"employs\"\n    TEAMS ||--o{ STUDENTS : \"contains\"\n    TEAMS ||--o{ MEETINGS : \"scopes\"\n    TEAMS ||--o{ TASKS : \"scopes\"\n    TEAMS ||--o{ EVENTS : \"scopes\"\n    USERS ||--o{ REFRESH_SESSIONS : \"holds\"\n    USERS ||--o| STUDENTS : \"linked via student_id\"\n    USERS ||--o{ STUDENTS : \"assigned as HR\"\n    USERS ||--o{ MEETINGS : \"responsible_user\"\n    USERS ||--o{ TASKS : \"creates\"\n    USERS ||--o{ SUBMISSIONS : \"grades\"\n    USERS ||--o{ SCORE_RECORDS : \"grades\"\n    USERS ||--o{ MEMBER_FOLLOWUP_STATUSES : \"owns flag\"\n    USERS ||--o{ WHATSAPP_CHAT_MESSAGES : \"assigned_hr\"\n    USERS ||--o{ MEMBER_FEEDBACKS : \"subject_hr\"\n    USERS ||--o{ MEMBER_FEEDBACKS : \"reviewer\"\n    USERS ||--o{ MEMBER_QUESTIONS : \"answers\"\n    USERS ||--o{ COMMITTEE_REPORTS : \"submits\"\n    USERS ||--o{ AUTOMATION_SETTINGS : \"configures\"\n    USERS ||--o{ STUDENT_INVITATIONS : \"issues\"\n\n    STUDENTS ||--o{ STUDENT_INVITATIONS : \"claims\"\n    STUDENTS ||--o{ MEETING_ASSIGNMENTS : \"assigned to\"\n    STUDENTS ||--o{ PARTICIPANT_SESSIONS : \"matched as\"\n    STUDENTS ||--o{ ATTENDANCE_RECORDS : \"receives\"\n    STUDENTS ||--o{ TASK_ASSIGNMENTS : \"assigned\"\n    STUDENTS ||--o{ SUBMISSIONS : \"submits\"\n    STUDENTS ||--o{ SCORE_RECORDS : \"scored\"\n    STUDENTS ||--o{ REMINDER_LOGS : \"recipient\"\n    STUDENTS ||--o{ TASK_REMINDERS : \"reminded\"\n    STUDENTS ||--o{ WHATSAPP_CHAT_MESSAGES : \"conversation\"\n    STUDENTS ||--o{ MEMBER_FOLLOWUP_STATUSES : \"flagged\"\n    STUDENTS ||--o{ MEMBER_FEEDBACKS : \"author\"\n    STUDENTS ||--o{ MEMBER_QUESTIONS : \"asks\"\n\n    MEETINGS ||--o{ PARTICIPANT_SESSIONS : \"raw logs\"\n    MEETINGS ||--o{ ATTENDANCE_RECORDS : \"produces\"\n    MEETINGS ||--o{ MEETING_ASSIGNMENTS : \"assigns\"\n    TASKS ||--o{ TASK_ASSIGNMENTS : \"assigns\"\n    TASKS ||--o{ SUBMISSIONS : \"collects\"\n    TASKS ||--o{ TASK_REMINDERS : \"reminds about\"\n\n    TEAMS {\n        string id PK\n        string name UK\n        string code UK\n        text description\n        datetime created_at\n    }\n    USERS {\n        string id PK\n        string email UK\n        string hashed_password\n        string full_name\n        string arabic_name\n        string role\n        string team_id FK\n        string student_id FK\n        boolean is_active\n        datetime created_at\n    }\n    REFRESH_SESSIONS {\n        string id PK\n        string user_id FK\n n        text content\n        string status\n        datetime asked_at\n        string answered_by_user_id FK\n        text answer\n        datetime answered_at\n    }\n    COMMITTEE_REPORTS {\n        string id PK\n        string team_id FK\n        string submitted_by_user_id FK\n        string report_title\n        text metrics_summary\n        text notes\n        datetime submitted_at\n        datetime acknowledged_at\n    }", "link": "rendered/05-er-diagram.svg", "file": "05-er-diagram.mmd"}, {"id": "05-migrations", "title": "Migrations and seeding", "caption": "How the schema is actually created versus how it is documented.", "src": "flowchart TB\n    subgraph Bootstrap[\"Application bootstrap\"]\n        B1[\"main.py lifespan startup\"] --> B2[\"init_db()<br/>Base.metadata.create_all\"]\n        B2 --> B3{\"ENVIRONMENT == development<br/>AND sqlite in DATABASE_URL?\"}\n        B3 -->|yes| B4[\"seed_all(session)\"]\n        B3 -->|no| B5[\"No seed. Production must be migrated.\"]\n        B4 --> B6[\"scheduler.start()<br/>BackgroundScheduler 300s\"]\n        B5 --> B6\n    end\n\n    subgraph Migration[\"Alembic - declared but not wired into startup\"]\n        M1[\"alembic/env.py\"] --> M2[\"3f35fadc1e13_baseline_schema\"]\n        M2 --> M3[\"4b8c9d0e1f2a_add_student_invitations\"]\n        M3 --> M4[\"5c9d2e7f1a3b_add_refresh_sessions\"]\n        M4 --> M5[\"6d0e3f8a2b4c_add_usernames\"]\n    end\n\n    subgraph SeedData[\"seed/seed_data.py - idempotent upserts\"]\n        S1[\"4 Teams: team_media, team_ops, team_eng, team_tech\"]\n        S2[\"8 Staff users with known dev passwords\"]\n        S3[\"CORE_TEAM students with student_id linked\"]\n        S4[\"Meetings, attendance, tasks, submissions,<br/>score_records, followup flags\"]\n    end\n\n    subgraph Schema[\"Schema authority\"]\n        SC1[\"backend/app/models/entities.py<br/>defines the 23 tables\"]\n        SC2[\"create_all uses the model metadata,<br/>NOT the migration history\"]\n    end\n\n    B2 --> SC1\n    B4 --> S1\n    S1 --> S2\n    S2 --> S3\n    S3 --> S4\n    SC1 --> SC2\n\n    RISK[\"Consequence: a table added to entities.py is created by create_all<br/>even with no matching migration. A table removed from entities.py but still<br/>present in the database is never dropped. Alembic and the ORM can drift apart<br/>with no automated check.\"]\n    SC2 -.-> RISK\n    M5 -.-> RISK\n\n    note[\"validate_production_secrets in config.py raises at import time if<br/>ENVIRONMENT=production and JWT_SECRET_KEY is still the dev default,<br/>or if DATABASE_URL contains 'sqlite'.\"]\n    B1 -.-> note", "link": "rendered/05-migrations.svg", "file": "05-migrations.mmd"}, {"id": "05-state-submission", "title": "Submission lifecycle", "caption": "Status transitions, including one unreachable branch.", "src": "stateDiagram-v2\n    direction LR\n    [*] --> PENDING : TaskAssignment created<br/>or assigned_student_ids supplied\n    PENDING --> ON_TIME : POST /tasks/{id}/submit<br/>submitted_at <= deadline\n    PENDING --> LATE : POST /tasks/{id}/submit<br/>submitted_at > deadline\n    PENDING --> MISSED : get_task_reminder_candidates<br/>post-deadline, still missing\n\n    ON_TIME --> ON_TIME : PUT /tasks/submissions/{sid}/review<br/>resubmission updates timestamp\n    LATE --> LATE : PUT /tasks/submissions/{sid}/review\n\n    note right of MISSED\n        MISSED is defined in the entity comment\n        and in get_task_reminder_candidates,\n        but no endpoint in routes_tasks.py\n        ever writes it. Every unsubmitted\n        assignment stays PENDING.\n    end note\n\n    note right of PENDING\n        pending_count in TaskSchema counts\n        status = PENDING. The MISSED\n        branch is documented but not\n        reachable through the REST API.\n    end note\n", "link": "rendered/05-state-submission.svg", "file": "05-state-submission.mmd"}, {"id": "05-state-attendance", "title": "Attendance lifecycle", "caption": "Policy outcomes and manual overrides.", "src": "stateDiagram-v2\n    direction TB\n    [*] --> PENDING_APPROVAL : POST /attendance/meetings/{id}/process\n    PENDING_APPROVAL --> PRESENT : delay <= 10m<br/>AND duration >= 70%\n    PENDING_APPROVAL --> LATE : duration >= 50%\n    PENDING_APPROVAL --> UNEXCUSED_ABSENT : no session<br/>OR duration < 50%\n    PENDING_APPROVAL --> EXCUSED_ACCEPTED : HR sets excuse_status\n    PENDING_APPROVAL --> EXCUSED_MODERATE : HR sets excuse_status\n    PENDING_APPROVAL --> EXCUSED_REJECTED : HR sets excuse_status\n\n    PRESENT --> EXCUSED_ACCEPTED : manual excuse\n    LATE --> EXCUSED_ACCEPTED : manual excuse\n    UNEXCUSED_ABSENT --> EXCUSED_ACCEPTED : manual excuse\n    EXCUSED_REJECTED --> EXCUSED_ACCEPTED : HR overturns\n\n    UNEXCUSED_ABSENT --> [*] : MemberFollowupStatus<br/>flagged_reason = ABSENT_{code}\n\n    note right of UNEXCUSED_ABSENT\n        Attractor state. Every reprocess run\n        re-evaluates and can move a student\n        into this state, and the automation\n        cycle writes a PENDING_APPROVAL\n        ReminderLog for it.\n    end note\n\n    note right of PENDING_APPROVAL\n        The name is misleading. PENDING_APPROVAL\n        is a ReminderLog.status value, not an\n        AttendanceRecord.status. All six\n        AttendanceRecord statuses are terminal;\n        only excuse overrides are reversible.\n    end note\n", "link": "rendered/05-state-attendance.svg", "file": "05-state-attendance.mmd"}, {"id": "05-state-agent-action", "title": "Agent action lifecycle", "caption": "The HITL state machine and immutability guarantees.", "src": "stateDiagram-v2\n    direction TB\n    [*] --> PENDING_CONFIRMATION : ReActAgent INTENT 2 reminder<br/>AuditService.record_action\n    PENDING_CONFIRMATION --> EXECUTING_CONFIRMATION : POST /agent/confirm confirmed=true<br/>atomic UPDATE WHERE status=PENDING_CONFIRMATION\n    PENDING_CONFIRMATION --> REJECTED : POST /agent/confirm confirmed=false\n\n    EXECUTING_CONFIRMATION --> EXECUTED : tool_send_reminder returned\n    EXECUTING_CONFIRMATION --> FAILED : tool_send_reminder raised\n\n    EXECUTED --> [*]\n    REJECTED --> [*]\n    FAILED --> [*]\n\n    note right of PENDING_CONFIRMATION\n        Replay guard. Any second POST\n        with the same action_id sees\n        status != PENDING_CONFIRMATION\n        and is rejected with 400. The\n        UPDATE ... WHERE status =\n        PENDING_CONFIRMATION also yields\n        409 on a concurrent race.\n    end note\n\n    note right of EXECUTED\n        The row is protected by database\n        triggers. UPDATE is only permitted\n        when id, action_id, intent, tool_name\n        and parameters are unchanged; DELETE\n        always raises. This is the only\n        permitted status transition.\n    end note\n", "link": "rendered/05-state-agent-action.svg", "file": "05-state-agent-action.mmd"}, {"id": "05-state-followup", "title": "Follow-up flag lifecycle", "caption": "The only two statuses written, and derived escalation.", "src": "stateDiagram-v2\n    direction TB\n    [*] --> PENDING : MemberFollowupStatus inserted\n    PENDING --> CONTACTED : POST /whatsapp/generate-link<br/>sets last_contacted_at\n    PENDING --> PENDING : GET /whatsapp/escalations<br/>days_open < 3\n    PENDING --> PENDING : days_open >= 3 and status != RESOLVED<br/>is_escalated computed true in serializer\n    CONTACTED --> CONTACTED : additional generate-link calls\n    CONTACTED --> [*] : RESOLVED\n    PENDING --> RESOLVED : RESOLVED\n\n    note right of PENDING\n        Two separate representations.\n        The status column only ever holds\n        PENDING or CONTACTED. The\n        is_escalated boolean column is\n        never written to true by app code;\n        escalation is derived at read time\n        from (utcnow - flagged_at).days >= 3.\n    end note\n\n    note right of RESOLVED\n        Unreachable. No endpoint, no agent\n        tool and no scheduler writes the\n        literal string RESOLVED into this\n        column. The transition exists in the\n        entity comment and in the read query\n        filter only.\n    end note\n", "link": "rendered/05-state-followup.svg", "file": "05-state-followup.mmd"}]}, {"title": "06 — Frontend", "doc": "docs/06-frontend.md", "diagrams": [{"id": "06-frontend-modules", "title": "Module and flow map", "caption": "How a route becomes a rendered view, and where data enters.", "src": "flowchart TB\n    subgraph Entry[\"Entry and Routing\"]\n        E1[\"main.tsx\"]\n        E2[\"App.tsx<br/>AppContent\"]\n        E3[\"hooks/useLocationPath<br/>navigate + useLocationPath\"]\n        E4[\"History API, no react-router<br/>vercel.json rewrites /app/* to index.html\"]\n        E1 --> E2\n        E2 --> E3\n        E3 --> E4\n    end\n\n    subgraph Providers[\"Context Providers - App.tsx export\"]\n        P1[\"ThemeProvider\"]\n        P2[\"LanguageProvider<br/>dir rtl/ltr on documentElement\"]\n        P3[\"ToastProvider\"]\n        P1 --> P2 --> P3\n    end\n\n    subgraph Session[\"Auth State Machine\"]\n        S1{\"api.getToken() present?\"}\n        S2[\"checkingSession = true\"]\n        S3[\"GET /api/auth/me\"]\n        S4[\"api.logout() on failure\"]\n        S5[\"currentUser: UserProfile | null\"]\n        S6[\"userRole = currentUser.role ?? 'member'\"]\n        S1 --> S2 --> S3 --> S5\n        S3 -.->|catch| S4\n    end\n\n    subgraph Guards[\"Route and Tab Guards\"]\n        G1{\"path starts with /app<br/>and no currentUser?\"}\n        G2[\"navigate('/login', true)\"]\n        G3{\"currentUser and<br/>path is /login or /signup?\"}\n        G4[\"navigate('/app/dashboard', true)\"]\n        G5[\"requestedTab = path.split('/')[2]\"]\n        G6[\"NAV_ITEMS.find(id === resolvedTab<br/>AND roles.includes(userRole))\"]\n        G7[\"Fallback: 'dashboard'\"]\n        G8[\"navigate(`/app/${activeTab}`, true)<br/>if requestedTab !== activeTab\"]\n        G1 -->|yes| G2\n        G3 -->|yes| G4\n        G5 --> G6 --> G7 --> G8\n    end\n\n  which are stubs, and the provider switch.", "src": "flowchart TB\n    subgraph In[\"Integrations in code\"]\n        I1[\"Google Meet Conference Records<br/>GoogleMeetAttendanceProvider\"]\n        I2[\"Google Calendar API v3<br/>GoogleCalendarProvider\"]\n        I3[\"OpenWA / whatsapp-web.js<br/>OpenWAProvider\"]\n        I4[\"Cloudflare Tunnel<br/>cloudflared\"]\n        I5[\"Groq API\"]\n        I6[\"OpenRouter API\"]\n        I7[\"Supabase PostgreSQL<br/>SQLAlchemy asyncpg\"]\n        I8[\"Mock providers<br/>MockAttendanceProvider<br/>MockCalendarProvider<br/>MockMessagingProvider\"]\n    end\n\n    I1 --> S1[\"Implemented as a stub.<br/>get_raw_meeting_attendance has a pass<br/>body and always returns None.<br/>No REST call is issued.\"]\n    I2 --> S2[\"Stub. get_upcoming_events<br/>returns an empty list.<br/>create_event echoes the input.<br/>CalendarService reads the DB table<br/>instead, so the UI still works.\"]\n\n    I3 --> S3[\"Fully implemented, 746 lines.<br/>10 httpx calls with timeouts<br/>from 3s to 15s. Used for the<br/>official channel, per-HR chat,<br/>media, reactions, edits, webhook.\"]\n\n    I4 --> S4[\"Infra only, in docker-compose.yml.<br/>Exposes a self-hosted OpenWA<br/>container to the internet.\"]\n\n    I5 --> S5[\"Primary LLM. OpenAI-compatible<br/>chat completions, stream true,<br/>45s timeout.\"]\n\n    I6 --> S6[\"Secondary LLM. Same shape,<br/>plus HTTP-Referer and X-Title.\"]\n\n    I7 --> S7[\"Production data tier via PgBouncer<br/>transaction pooler on 6543.<br/>Prepared statement caches are<br/>disabled for pooled URLs.\"]\n\n    I8 --> S8[\"Selected when ENVIRONMENT != production<br/>AND MESSAGING_PROVIDER != openwa.<br/>Keeps demos and tests deterministic.\"]\n\n    SEL{\"use_live_providers<br/>= ENVIRONMENT==production<br/>OR MESSAGING_PROVIDER==openwa\"}\n    SEL -->|true| I1\n    SEL -->|true| I2\n    SEL -->|false| I8\n\n    MSG{\"MESSAGING_PROVIDER\"}\n    MSG -->|mock| M1[\"MockMessagingProvider<br/>records in memory, no network\"]\n    MSG -->|openwa| I3\n    MSG -->|other| M2[\"Factory raises ValueError\"]\n\n    note[\"Not an integration: boto3 is declared in pyproject.toml and<br/>requirements.txt but is never imported anywhere in backend/app or api.<br/>There is no AWS SDK usage in the running application.\"]\n", "link": "rendered/07-integrations.svg", "file": "07-integrations.mmd"}]}];
const m = mermaid;
m.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose', flowchart: { useMaxWidth: true } });

async function render(el, src, id) {
  try {
    const { svg } = await m.render(id, src);
    el.innerHTML = svg;
  } catch (e) {
    el.innerHTML = '<div class="error">Failed to render: ' + String(e && e.message || e) + '</div>';
  }
}

(async () => {
  const main = document.getElementById('main');
  for (const sec of DATA) {
    const s = document.createElement('section');
    s.id = 'sec-' + sec.title.split(' ')[0];
    const h2 = document.createElement('h2');
    h2.innerHTML = sec.title + ' <a href="../' + sec.doc + '">' + sec.doc + '</a>';
    s.appendChild(h2);
    for (const d of sec.diagrams) {
      const card = document.createElement('div');
      card.className = 'card';
      const head = document.createElement('div');
      const tog = document.createElement('span');
      tog.className = 'toggle';
      tog.textContent = 'toggle';
      const t = document.createElement('h3');
      t.textContent = d.title;
      head.appendChild(tog); head.appendChild(t);
      tog.onclick = () => {
        const box = card.querySelector('.diagram');
        box.classList.toggle('hidden');
        if (!box.dataset.rendered) { render(box, d.src, 'mmd-' + d.id); box.dataset.rendered = '1'; }
      };
      const cap = document.createElement('p');
      cap.className = 'caption';
      cap.textContent = d.caption;
      const box = document.createElement('div');
      box.className = 'diagram';
      box.textContent = 'Rendering...';
      const links = document.createElement('div');
      links.className = 'links';
      links.innerHTML = '<a href="' + d.file + '">Mermaid source</a><a href="' + d.link + '">Pre-rendered SVG</a>';
      card.appendChild(head); card.appendChild(cap); card.appendChild(box); card.appendChild(links);
      s.appendChild(card);
      await render(box, d.src, 'mmd-' + d.id);
      box.dataset.rendered = '1';
    }
    main.appendChild(s);
  }
})();
</script>
</body>
</html>
